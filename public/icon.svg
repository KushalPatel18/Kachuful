<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e3d"/>
      <stop offset="50%" stop-color="#1a2b5e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Card Back Shadow -->
  <g filter="url(#shadow)">
    <!-- Angled Card 1 -->
    <rect x="110" y="110" width="180" height="260" rx="18" fill="#1e293b" transform="rotate(-15 200 240)" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Angled Card 2 (Main Card) -->
    <rect x="180" y="96" width="190" height="280" rx="18" fill="url(#cardGrad)" transform="rotate(8 275 236)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Card Content (Ace of Spades / Judgement) -->
    <g transform="rotate(8 275 236)">
      <text x="202" y="142" font-family="'Outfit', sans-serif" font-weight="900" font-size="42" fill="#0f172a">A</text>
      <!-- Spade icon small -->
      <path d="M214 150 C214 150, 204 165, 204 172 C204 177, 208 181, 213 181 C216 181, 218 179, 219 177 L218 185 L222 185 L221 177 C222 179, 224 181, 227 181 C232 181, 236 177, 236 172 C236 165, 226 150, 226 150 Z" fill="#0f172a" transform="scale(0.8) translate(36, 32)"/>

      <!-- Center Big Spade -->
      <g transform="translate(275, 236) scale(2.2)">
        <path d="M0 -30 C-1 -25, -24, 6, -24, 18 C-24, 28, -14, 34, -4, 34 C0, 34, 3, 31, 5, 27 C4, 34, 2, 40, -6, 44 L16, 44 C8, 40, 6, 34, 5, 27 C7, 31, 10, 34, 14, 34 C24, 34, 34, 28, 34, 18 C34, 6, 11, -25, 10, -30 Z" fill="#0f172a" transform="translate(-5, -6)"/>
      </g>
    </g>
  </g>

  <!-- Crown / Judgement Emblem Top -->
  <g transform="translate(256, 75) scale(0.9)">
    <path d="M-40,20 L-30,-15 L-10,5 L0,-25 L10,5 L30,-15 L40,20 Z" fill="url(#goldGrad)"/>
    <circle cx="-30" cy="-18" r="4" fill="#fef08a"/>
    <circle cx="0" cy="-28" r="5" fill="#fef08a"/>
    <circle cx="30" cy="-18" r="4" fill="#fef08a"/>
  </g>

  <!-- Bottom Banner: JUDGEMENT -->
  <rect x="76" y="415" width="360" height="54" rx="27" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="452" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="26" fill="#fcd34d" letter-spacing="4">JUDGEMENT</text>
</svg>